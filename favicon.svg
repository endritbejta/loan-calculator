<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Euro">
  <!-- Paths rather than a <text> element: a favicon renders outside the page,
       where the site's webfont isn't guaranteed to be available. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.6">
    <!-- Open ring of the euro sign, sweeping the long way round the left. -->
    <path d="M21.7 11.3a7 7 0 1 0 0 9.4"/>
    <path d="M8.8 14.6h9.6" stroke-width="2.3"/>
    <path d="M8.8 18.1h9.6" stroke-width="2.3"/>
  </g>
</svg>
